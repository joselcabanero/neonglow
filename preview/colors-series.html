<!-- @dsCard group="Colors" viewport="700x360" name="Neon glow series" subtitle="Five chart series · bright on ink · deep on paper · fixed order" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Neon glow series</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);font-family:var(--font-sans);}
  .row{padding:20px 32px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .row.dark{background:var(--ink);}
  .sw{display:flex;flex-direction:column;}
  .chip{height:64px;border-radius:6px;}
  .info{padding:8px 2px 0;}
  .name{font-size:13px;font-weight:500;}
  .hex{font-family:var(--font-mono);font-size:11px;margin-top:2px;}
  .lbl{grid-column:1/-1;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;}
</style></head><body>
<div class="row dark"><div class="lbl" style="color:#9a9a9e">On ink · --series-N (dark) · ≥7:1</div><div class="sw"><div class="chip" style="background:#7BF076"></div><div class="info"><div class="name" style="color:#f2f2f4">1. Green</div><div class="hex" style="color:#9a9a9e">#7BF076</div></div></div><div class="sw"><div class="chip" style="background:#2FD4FF"></div><div class="info"><div class="name" style="color:#f2f2f4">2. Cyan</div><div class="hex" style="color:#9a9a9e">#2FD4FF</div></div></div><div class="sw"><div class="chip" style="background:#B794FF"></div><div class="info"><div class="name" style="color:#f2f2f4">3. Violet</div><div class="hex" style="color:#9a9a9e">#B794FF</div></div></div><div class="sw"><div class="chip" style="background:#FFC94A"></div><div class="info"><div class="name" style="color:#f2f2f4">4. Amber</div><div class="hex" style="color:#9a9a9e">#FFC94A</div></div></div><div class="sw"><div class="chip" style="background:#FF8A3D"></div><div class="info"><div class="name" style="color:#f2f2f4">5. Ember</div><div class="hex" style="color:#9a9a9e">#FF8A3D</div></div></div></div>
<div class="row"><div class="lbl" style="color:var(--ink-3)">On paper · --series-N (light) · ≥3:1</div><div class="sw"><div class="chip" style="background:#1F9A1F"></div><div class="info"><div class="name" style="color:var(--ink)">1. Green</div><div class="hex" style="color:var(--ink-3)">#1F9A1F</div></div></div><div class="sw"><div class="chip" style="background:#0077C8"></div><div class="info"><div class="name" style="color:var(--ink)">2. Cyan</div><div class="hex" style="color:var(--ink-3)">#0077C8</div></div></div><div class="sw"><div class="chip" style="background:#7C4DFF"></div><div class="info"><div class="name" style="color:var(--ink)">3. Violet</div><div class="hex" style="color:var(--ink-3)">#7C4DFF</div></div></div><div class="sw"><div class="chip" style="background:#C27C00"></div><div class="info"><div class="name" style="color:var(--ink)">4. Amber</div><div class="hex" style="color:var(--ink-3)">#C27C00</div></div></div><div class="sw"><div class="chip" style="background:#D9640F"></div><div class="info"><div class="name" style="color:var(--ink)">5. Ember</div><div class="hex" style="color:var(--ink-3)">#D9640F</div></div></div></div>
</body></html>
