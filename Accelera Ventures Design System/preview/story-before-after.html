<style>.g{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center}.col .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#555;font-weight:500;margin-bottom:8px}.col .v{font-size:40px;font-weight:500;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums}.col .v small{font-size:.4em;color:#555;font-weight:400}.bar{height:14px;background:#e0e0e4;margin-top:12px}.bar i{display:block;height:100%;background:#0a0a0a}.col.after .bar i{background:#7BF076}.delta{display:flex;flex-direction:column;align-items:center;gap:6px}.chip{background:#0a0a0a;color:#fff;font-family:'Ubuntu Mono',monospace;font-size:12px;font-weight:700;padding:6px 10px}.delta .s{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#555}</style><style>:root{--r-sm:6px;--r:12px;--r-lg:16px}.chip,.c,.k,.cell,.card,.b,.opt,.st,.sw .chip,.bar,.bw,.bar-wrap,.bar-fill,.dist,.tag,.card-cell,.frame,.chrome,.body-z{border-radius:var(--r-sm)}.box,.pv,.preview,.chart,.kpis,.ask,.arc,.card-grid,.wrap>.grid,.col .bar,.delta .chip,.hero,.k.hi{border-radius:var(--r)}.kpis,.ask,.arc,.card-grid,.wrap>.grid{overflow:hidden}.chapter.dark{border-radius:var(--r-lg)}svg rect{rx:3px}</style></head><body>
<div class="wrap">
<div class="g">

</div>
</div></body></html>
