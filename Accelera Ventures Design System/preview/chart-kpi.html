<!-- @dsCard group="Charts" viewport="700x220" name="KPI" subtitle="Four-up tiles · value → delta → context · 2 px grid" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>KPI</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="chart.css">
<style>
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#0a0a0a;border:2px solid #0a0a0a}
.k{background:#fff;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.k .l{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#555;font-weight:500}
.k .v{font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums}
.k .v small{font-size:.4em;color:#555;font-weight:400;margin-left:2px}
.k .d{font-family:'Ubuntu Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;margin-top:auto}
.k .d i{width:8px;height:8px;background:#7BF076;display:inline-block}
.k .d.n{color:#555;font-weight:400}.k .d.n i{background:#9a9a9e}
.k .d.z{color:#555;font-weight:400}.k .d.z i{background:#e0e0e4}
.k .c{font-size:10px;color:#555}
.k.hi{background:#0a0a0a;color:#fff}.k.hi .l,.k.hi .c{color:#9a9a9e}.k.hi .v{color:#7BF076}.k.hi .v small{color:#c6c6cb}
</style><style>:root{--r-sm:6px;--r:12px;--r-lg:16px}.chip,.c,.k,.cell,.card,.b,.opt,.st,.sw .chip,.bar,.bw,.bar-wrap,.bar-fill,.dist,.tag,.card-cell,.frame,.chrome,.body-z{border-radius:var(--r-sm)}.box,.pv,.preview,.chart,.kpis,.ask,.arc,.card-grid,.wrap>.grid,.col .bar,.delta .chip,.hero,.k.hi{border-radius:var(--r)}.kpis,.ask,.arc,.card-grid,.wrap>.grid{overflow:hidden}.chapter.dark{border-radius:var(--r-lg)}svg rect{rx:3px}</style></head><body>
<div class="wrap">
<div class="grid">
<div class="k hi"><div class="l">Portfolio value</div><div class="v">€6.12<small>M</small></div><div class="d"><i></i>+€0.34M QoQ</div><div class="c">On €4.15M deployed</div></div>
<div class="k"><div class="l">Blended MOIC</div><div class="v">1.47<small>×</small></div><div class="d"><i></i>+0.06× QoQ</div><div class="c">SPV 2.09× · Fund I 1.27×</div></div>
<div class="k"><div class="l">Active companies</div><div class="v">32</div><div class="d z"><i></i>No change</div><div class="c">35 invested · 2 written off · 1 exit</div></div>
<div class="k"><div class="l">DPI</div><div class="v">0.36<small>×</small></div><div class="d n"><i></i>−0.02× vs plan</div><div class="c">Single realisation to date</div></div>
</div>
</div></body></html>
