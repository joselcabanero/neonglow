<!-- @dsCard group="Maps" viewport="700x340" name="Regional zoom · Iberia" subtitle="Mercator fit to one region · focus in ink · neighbours in grey · labelled points" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Regional zoom</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="chart.css">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="map.js"></script>
<style>:root{--r:12px}.g{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}.map{border-radius:var(--r);overflow:hidden;background:#fff}.rows{display:flex;flex-direction:column}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid rgba(10,10,10,.12);font-size:12px}.row .v{font-family:'Ubuntu Mono',monospace;font-weight:700;font-variant-numeric:tabular-nums}.row .s{color:#555;font-size:10px}</style></head><body>
<div class="wrap">
<div class="ttl"><span>Spain Foodtech Genesys SPV · positions by city</span><b>€1.55M · 2.09×</b></div>
<div class="g">
<div id="m" class="map"></div>
<div class="rows">
<div class="row"><div>Madrid<div class="s">7 positions · Ekonoke exit</div></div><div class="v">€620K</div></div>
<div class="row"><div>Barcelona<div class="s">5 positions</div></div><div class="v">€410K</div></div>
<div class="row"><div>Valencia<div class="s">3 positions</div></div><div class="v">€240K</div></div>
<div class="row"><div>Bilbao<div class="s">2 positions</div></div><div class="v">€150K</div></div>
<div class="row" style="border-bottom:none"><div>Seville<div class="s">2 positions</div></div><div class="v">€130K</div></div>
</div>
</div>
</div>
<script>
(async()=>{const M=AcceleraMap,I=M.ID;const feats=await M.countries();
const W=380,H=250;const s=M.svg('#m',W,H);
const es=feats.find(f=>f.id===I.ES);
const proj=d3.geoMercator().fitExtent([[10,10],[W-10,H-10]],{type:'MultiPoint',coordinates:[[-9.5,35.8],[3.5,44]]});const path=d3.geoPath(proj);
M.land(s,feats.filter(f=>f.id!==I.ES),path,M.G1);
s.append('path').datum(es).attr('d',path).attr('fill',M.G3).attr('stroke','#fff').attr('stroke-width',.6);
const pts=[['Madrid',-3.70,40.42,620,true],['Barcelona',2.17,41.39,410],['Valencia',-0.38,39.47,240],['Bilbao',-2.93,43.26,150],['Seville',-5.99,37.39,130]];
const r=d3.scaleSqrt().domain([0,620]).range([0,16]);const g=s.append('g');
for(const [n,lon,lat,v,ex] of pts){const [x,y]=proj([lon,lat]);g.append('circle').attr('cx',x).attr('cy',y).attr('r',r(v)).attr('fill',ex?M.ACC:M.INK).attr('stroke',M.INK).attr('stroke-width',1.5);g.append('text').attr('x',x+r(v)+5).attr('y',y+4).attr('class','lbl').style('font-size','10px').text(n);}
})();
</script>
</body></html>
